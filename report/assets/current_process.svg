<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 22px; fill: #1e293b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #64748b; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 15px; fill: #0f172a; }
      .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #475569; }
      .time-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 12px; fill: #ffffff; }
      .bottleneck-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 12px; fill: #dc2626; }
      .arrow { stroke: #94a3b8; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #94a3b8; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" class="arrow-head" />
    </marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#ef4444" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="shadow-red" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#ef4444" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Header -->
  <text x="50" y="50" class="title">Quy trình hiện tại — Tổng hợp &amp; Review bài nộp nhóm trước deadline</text>
  <text x="50" y="75" class="subtitle">Tổng thời gian: ~80 phút | Bối cảnh: 20h00 – 23h30 tối trước deadline | 100% làm thủ công bằng sức người</text>

  <!-- Row 1: Steps 1 -> 4 -->
  <!-- Step 1 -->
  <g transform="translate(50, 110)">
    <rect width="195" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="195" height="32" rx="12" fill="#3b82f6" />
    <rect x="0" y="20" width="195" height="12" fill="#3b82f6" />
    <text x="12" y="22" class="time-badge">BƯỚC 1 · 10 PHÚT</text>
    <text x="14" y="60" class="node-title">1. Gom bài thành viên</text>
    <text x="14" y="85" class="node-desc">Nhóm trưởng kéo 4 file</text>
    <text x="14" y="105" class="node-desc">từ các nhánh Git / Docs.</text>
    <text x="14" y="130" class="node-desc" fill="#94a3b8" style="font-size:11px;">Actor: Nhóm trưởng</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="245" y1="185" x2="285" y2="185" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 2 -->
  <g transform="translate(295, 110)">
    <rect width="195" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="195" height="32" rx="12" fill="#3b82f6" />
    <rect x="0" y="20" width="195" height="12" fill="#3b82f6" />
    <text x="12" y="22" class="time-badge">BƯỚC 2 · 5 PHÚT</text>
    <text x="14" y="60" class="node-title">2. Ghép vào file chung</text>
    <text x="14" y="85" class="node-desc">Copy/paste nội dung vào</text>
    <text x="14" y="105" class="node-desc">file group_report.md.</text>
    <text x="14" y="130" class="node-desc" fill="#94a3b8" style="font-size:11px;">Dễ format lệch chuẩn</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="490" y1="185" x2="530" y2="185" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 3 -->
  <g transform="translate(540, 110)">
    <rect width="180" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="180" height="32" rx="12" fill="#3b82f6" />
    <rect x="0" y="20" width="180" height="12" fill="#3b82f6" />
    <text x="12" y="22" class="time-badge">BƯỚC 3 · 5 PHÚT</text>
    <text x="14" y="60" class="node-title">3. Mở đề &amp; Rubric</text>
    <text x="14" y="85" class="node-desc">Mở RUBRIC.md bên cạnh</text>
    <text x="14" y="105" class="node-desc">để chuẩn bị dò mắt.</text>
    <text x="14" y="130" class="node-desc" fill="#94a3b8" style="font-size:11px;">Thang 100 điểm</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="720" y1="185" x2="760" y2="185" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowhead-red)" />

  <!-- Step 4: BOTTLENECK -->
  <g transform="translate(770, 95)">
    <rect width="180" height="180" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5" filter="url(#shadow-red)" />
    <rect x="0" y="0" width="180" height="34" rx="14" fill="#ef4444" />
    <rect x="0" y="20" width="180" height="14" fill="#ef4444" />
    <text x="12" y="23" class="time-badge">BƯỚC 4 · 35–40 PHÚT</text>
    <text x="14" y="60" class="node-title" fill="#b91c1c">4. Đọc chéo &amp; dò lỗi</text>
    <text x="14" y="85" class="node-desc">Đối chiếu từng mục rubric</text>
    <text x="14" y="105" class="node-desc">&amp; tìm mâu thuẫn số liệu.</text>
    <text x="14" y="130" class="bottleneck-tag">⚠ BOTTLENECK CHÍNH</text>
    <text x="14" y="150" class="node-desc" style="font-size:11px; fill:#dc2626;">(Hoa mắt, sát giờ nộp)</text>
  </g>

  <!-- Downward Arrow from Step 4 -> Step 5 -->
  <path d="M 860 275 L 860 330 L 860 365" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Row 2: Steps 7 <- 6 <- 5 -->
  <!-- Step 5 -->
  <g transform="translate(690, 375)">
    <rect width="260" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="260" height="32" rx="12" fill="#3b82f6" />
    <rect x="0" y="20" width="260" height="12" fill="#3b82f6" />
    <text x="12" y="22" class="time-badge">BƯỚC 5 · 15 PHÚT</text>
    <text x="14" y="60" class="node-title">5. Nhắn nhóm &amp; chờ sửa</text>
    <text x="14" y="85" class="node-desc">Tag tên thành viên vào nhóm chat</text>
    <text x="14" y="105" class="node-desc">yêu cầu sửa các chỗ bị thiếu hoặc lệch.</text>
    <text x="14" y="130" class="node-desc" fill="#94a3b8" style="font-size:11px;">Sốt ruột, chờ đợi qua lại</text>
  </g>

  <!-- Arrow 5 -> 6 (Pointing Left) -->
  <line x1="690" y1="450" x2="630" y2="450" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 6 -->
  <g transform="translate(360, 375)">
    <rect width="260" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="260" height="32" rx="12" fill="#3b82f6" />
    <rect x="0" y="20" width="260" height="12" fill="#3b82f6" />
    <text x="12" y="22" class="time-badge">BƯỚC 6 · 5 PHÚT</text>
    <text x="14" y="60" class="node-title">6. Format &amp; Kiểm tra tên file</text>
    <text x="14" y="85" class="node-desc">Soát lại format bảng Markdown, link ảnh</text>
    <text x="14" y="105" class="node-desc">và cú pháp tên repo / file nộp bài.</text>
    <text x="14" y="130" class="node-desc" fill="#94a3b8" style="font-size:11px;">Tránh lỗi trừ điểm hình thức</text>
  </g>

  <!-- Arrow 6 -> 7 (Pointing Left) -->
  <line x1="360" y1="450" x2="300" y2="450" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 7 -->
  <g transform="translate(50, 375)">
    <rect width="240" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="240" height="32" rx="12" fill="#16a34a" />
    <rect x="0" y="20" width="240" height="12" fill="#16a34a" />
    <text x="12" y="22" class="time-badge">BƯỚC 7 · 5 PHÚT · HOÀN THÀNH</text>
    <text x="14" y="60" class="node-title" fill="#15803d">7. Commit &amp; Nộp LMS</text>
    <text x="14" y="85" class="node-desc">Git push commit cuối cùng và nộp</text>
    <text x="14" y="105" class="node-desc">link repo lên LMS lúc 23h30.</text>
    <text x="14" y="130" class="node-desc" fill="#16a34a" style="font-weight:600; font-size:12px;">Đạt mục tiêu nộp bài</text>
  </g>

  <!-- Footer note -->
  <rect x="50" y="555" width="900" height="40" rx="8" fill="#e2e8f0" />
  <text x="70" y="580" style="font-family: -apple-system, sans-serif; font-size: 13px; fill: #334155;">
    <tspan font-weight="700">Hậu quả thực tế:</tspan> Tốn 75–90 phút, nhóm trưởng kiệt sức sát giờ nộp; 2/5 bài gần nhất vẫn bị sót trường thông tin hoặc số liệu mâu thuẫn.
  </text>
</svg>

